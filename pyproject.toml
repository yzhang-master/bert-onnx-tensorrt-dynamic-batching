[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-onnx-tensorrt-dynamic-batching"
version = "0.1.0"
description = "BERT-style ONNX inference with CPU dynamic batching and a pending TensorRT path"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "onnx>=1.16", "onnxruntime>=1.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
tensorrt = ["tensorrt>=8.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
